<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Writer - Exposés</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Document Writer pour Exposés</h1>
            <div class="controls">
                <button onclick="newDocument()">Nouveau</button>
                <button onclick="exportPDF()">Export PDF</button>
                <button onclick="exportWord()">Export Word</button>
                <button onclick="saveDocument()">Sauvegarder</button>
            </div>
        </header>
        
        <div class="toolbar">
            <button onclick="formatText('bold')">Gras</button>
            <button onclick="formatText('italic')">Italique</button>
            <button onclick="formatText('h1')">Titre 1</button>
            <button onclick="formatText('h2')">Titre 2</button>
            <button onclick="insertSection('Introduction')">Introduction</button>
            <button onclick="insertSection('Développement')">Développement</button>
            <button onclick="insertSection('Conclusion')">Conclusion</button>
        </div>

        <div id="editor" contenteditable="true" class="editor">
            <h1 id="doc-title">Titre de l'exposé</h1>
            <section id="intro">
                <h2>Introduction</h2>
                <p>Écrivez ici votre introduction...</p>
            </section>
            <section id="dev">
                <h2>Développement</h2>
                <p>Écrivez ici le corps de votre exposé...</p>
            </section>
            <section id="conclusion">
                <h2>Conclusion</h2>
                <p>Écrivez ici votre conclusion...</p>
            </section>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
