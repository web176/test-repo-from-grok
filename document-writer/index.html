<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Writer - Exposés</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Document Writer pour Exposés</h1>
            <div class="controls">
                <button onclick="exportPDF()">📄 Export PDF</button>
                <button onclick="exportWord()">📘 Export Word</button>
                <button onclick="saveDocument()">💾 Sauvegarder</button>
                <button onclick="clearDocument()">🆕 Nouveau</button>
            </div>
        </header>

        <div class="toolbar">
            <button onclick="formatText('bold')">𝐁 Gras</button>
            <button onclick="formatText('italic')">𝑰 Italique</button>
            <button onclick="formatText('h1')">H1</button>
            <button onclick="formatText('h2')">H2</button>
            <button onclick="addSection('Introduction')">Introduction</button>
            <button onclick="addSection('Développement')">Développement</button>
            <button onclick="addSection('Conclusion')">Conclusion</button>
        </div>

        <div id="editor" contenteditable="true" class="editor">
            <h1>Titre de mon exposé</h1>
            <p>Commencez à rédiger ici...</p>
        </div>
    </div>

    <!-- jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
