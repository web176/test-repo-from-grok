<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Writer - Créateur d'Exposés</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .toolbar {
            background: #34495e;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid #ddd;
        }
        button {
            padding: 10px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #2980b9; }
        .editor-area {
            padding: 20px;
        }
        #editor {
            width: 100%;
            height: 550px;
            border: 1px solid #ddd;
            padding: 20px;
            font-size: 16px;
            line-height: 1.7;
            resize: vertical;
            font-family: Georgia, serif;
        }
        .preview {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 20px;
            background: #f9f9f9;
            min-height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Document Writer pour Exposés</h1>
            <p>Outil web complet pour rédiger, structurer et exporter tes présentations</p>
        </header>

        <div class="toolbar">
            <button onclick="formatText('bold')"><i class="fas fa-bold"></i> Gras</button>
            <button onclick="formatText('italic')"><i class="fas fa-italic"></i> Italique</button>
            <button onclick="formatText('underline')"><i class="fas fa-underline"></i> Souligné</button>
            <button onclick="addHeading(1)">H1</button>
            <button onclick="addHeading(2)">H2</button>
            <button onclick="addSection()">+ Section</button>
            <button onclick="insertList('ul')">Liste</button>
            <button onclick="exportToPDF()">📄 Exporter PDF</button>
            <button onclick="exportToWord()">📘 Exporter Word (.docx)</button>
            <button onclick="saveToLocal()">💾 Sauvegarder</button>
        </div>

        <div class="editor-area">
            <textarea id="editor" spellcheck="true"># Titre de ton Exposé

## Introduction
Écris ici l'introduction...

## Développement

### Point 1

### Point 2

## Conclusion

**Intégration Dimanche** : Résumé hebdomadaire ou notes du dimanche à intégrer ici.</textarea>
        </div>

        <div style="padding: 20px; text-align: center; color: #666;">
            <small>Export PDF via jsPDF • Export Word via library • Intégration Dimanche à personnaliser selon tes besoins</small>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const editor = document.getElementById('editor');

        function formatText(command) {
            editor.focus();
            document.execCommand(command, false, null);
        }

        function addHeading(level) {
            editor.value += '\n\n' + '#'.repeat(level) + ' Titre ' + level + '\n\n';
            editor.focus();
        }

        function addSection() {
            editor.value += '\n\n## Nouvelle Section\n\nContenu...\n\n';
        }

        function insertList(type) {
            editor.value += '\n\n- Item 1\n- Item 2\n';
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = editor.value;
            doc.text(text, 10, 10);
            doc.save('expose.pdf');
            alert('PDF généré ! (basique - améliorable)');
        }

        function exportToWord() {
            alert('Export Word : Dans une version avancée, on utilisera FileSaver + docx.js ou mammoth. Pour l\'instant simulation.');
            // Advanced: generate .docx blob
            const content = editor.value.replace(/\n/g, '<br>');
            const blob = new Blob(['<html><head><meta charset="utf-8"></head><body>' + content + '</body></html>'], {type: 'application/msword'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'expose.doc';
            a.click();
        }

        function saveToLocal() {
            localStorage.setItem('documentWriterContent', editor.value);
            alert('Document sauvegardé dans le navigateur !');
        }

        // Load saved content
        if (localStorage.getItem('documentWriterContent')) {
            editor.value = localStorage.getItem('documentWriterContent');
        }
    </script>
</body>
</html>
